packages:
  - 'dsh-context-compass'
  - 'dsh-knowledge-sqlite'
  - 'dsh-subagent-router'
  - 'dsh-subagent-cursor'
  - 'dsh-imgdraw'
allowBuilds:
  esbuild: true
# dsh 0.1.1 这一代从未发布过稳定版（仅 next tag 有 0.1.1-rc.2），
# 但部分包的 peer/依赖链引用了 ^0.1.1 稳定范围导致解析失败；
# 全部强制对齐宿主 dsh CLI 0.1.1-rc.2 自带的版本。
overrides:
  '@deepseek-ai/dsh-system-prompt': 0.1.1-rc.2
  '@deepseek-ai/dsh-invariants': 0.1.1-rc.2
  '@deepseek-ai/dsh-brand': 0.1.1-rc.2
  '@deepseek-ai/dsh-scope': 0.1.1-rc.2
  '@deepseek-ai/dsh-llm': 0.1.1-rc.2
  '@deepseek-ai/dsh-llm-retry': 0.1.1-rc.2
  '@deepseek-ai/dsh-typert-protocol': 0.1.1-rc.2
  '@deepseek-ai/dsh-typert-registry': 0.1.1-rc.2
  '@deepseek-ai/dsh-timeout': 0.1.1-rc.2
  '@deepseek-ai/dsh-attachment': 0.1.1-rc.2
  '@deepseek-ai/dsh-code-runtime': 0.1.1-rc.2
  '@deepseek-ai/dsh-user-approval': 0.1.1-rc.2
  '@deepseek-ai/dsh-agent': 0.1.1-rc.2
  '@deepseek-ai/dsh-agent-presets': 0.1.1-rc.2
  '@deepseek-ai/dsh-agent-default-model': 0.1.1-rc.2
