# dsh-subagent-router bundle layer: registers the `subagent_model`
# delegation tool (per-call provider / model / max_tokens overrides) and the
# `subagent_models` catalog tool. Apply as a profile bundle
# (`dsh plugin add dsh-subagent-router`) or via a profile overlay.
- insert:
    - id: subagent-router
      name: 'dsh-subagent-router'
