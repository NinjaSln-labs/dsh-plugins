# dsh-context-compass 发布工作流（人工审批门）
#
# 安全模型：
# - 触发 = 本机人工创建的 tag（context-compass-vX.Y.Z），发布决策永远是人的决定
# - 权限最小化：workflow 仅 contents: read；NPM_TOKEN 只注入 publish 步骤的 env
# - token = npm granular access token（仅授权 dsh-context-compass 包），存 GitHub secrets
# - 审批门：environment `npm-publish` + required reviewers——CI 全自动跑完验证后，
#   需仓库管理员在 GitHub 页面批准才真正执行 npm publish
# - 版本一致性守卫：tag 版本必须与 package.json version 完全一致，防误发/伪造 tag
# - actions 按 SHA 固定，防 action 供应链投毒
#
# 一次性配置（发布前必须完成）：
# 1. npm（https://www.npmjs.com/settings/<user>/tokens）→ Generate New Token →
#    Granular Access Token → Packages 勾选 dsh-context-compass（Read and write）→ Automation
# 2. GitHub 仓库 Settings → Secrets and variables → Actions →
#    New repository secret → 名称 NPM_TOKEN，粘贴上述 token（不要发到聊天里）
# 3. GitHub 仓库 Settings → Environments → New environment → 名称 npm-publish →
#    Protection rules → Required reviewers → 选择你自己
#
# 发布流程（日常）：
#   cd dsh-plugins/dsh-context-compass
#   npm version patch -m "chore: release v%s"     # 自动提交 + 打 tag
#   git push && git push --tags                    # CI 接手：验证链 → 等你在 GitHub 批准 → publish
name: publish

on:
  push:
    tags:
      - 'context-compass-v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: dsh-context-compass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          # lockfile 位于包子目录 dsh-context-compass/package-lock.json（defaults
          # working-directory 不作用于 action 的 cache 探测）——必须显式给
          # cache-dependency-path，否则 setup-node 在仓库根找不到锁文件直接报错
          # （2026-08-16 实测：Setup Node 失败 "Dependencies lock file is not found"）
          cache-dependency-path: dsh-context-compass/package-lock.json
      - name: 'Guard: tag version matches package.json'
        run: |
          EXPECTED="refs/tags/context-compass-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "$EXPECTED" ]; then
            echo "::error::tag/version mismatch: $GITHUB_REF vs $EXPECTED"
            exit 1
          fi
      - name: Install
        run: npm ci
        # 视觉回归只在本地跑（需运行中 harness），CI 不装浏览器：
        # playwright 的 postinstall 默认下载 chromium（~170MB）。
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Verify (build + typecheck + smoke + mount + client-mount)
        run: |
          npm run build
          npm run typecheck
          npm run smoke
          npm run mount
          node scripts/client-mount.mjs
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
